<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>City Blue Add Outfit - light</title>
  <style>
    :root {
      --bg:#F6F8FB; --surface:#FFFFFF; --surface-alt:#E8EEF6; --primary:#3F68A8;
      --accent:#7396BF; --accent-2:#C78363; --text:#202A38; --muted:#6E7A8A;
      --line:#DDE6F1; --tag:#E6EDF7; --shadow:rgba(42,68,104,.13); --button-text:#F6F8FB;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      letter-spacing: 0; display: grid; place-items: start center; padding: 28px;
    }
    .page {
      width: 390px; min-height: 844px; overflow: hidden; background: var(--bg);
      border: 1px solid var(--line); border-radius: 28px; box-shadow: 0 24px 60px var(--shadow);
      position: relative;
    }
    .status { height: 42px; padding: 14px 22px 0; display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; }
    .content { padding: 12px 18px 92px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .title-block small { color: var(--muted); font-size: 12px; font-weight: 700; }
    h1 { margin: 4px 0 0; font-size: 28px; line-height: 1.08; font-weight: 850; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 17px; font-weight: 820; letter-spacing: 0; }
    .icon-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--text); border: 1px solid var(--line); box-shadow: 0 8px 18px var(--shadow); font-size: 18px; font-weight: 800; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 16px; box-shadow: 0 12px 28px var(--shadow); }
    .soft-card { background: var(--surface-alt); border-radius: 20px; padding: 14px; }
    .section { margin-top: 18px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .muted { color: var(--muted); }
    .chip, .pill { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--tag); color: var(--muted); font-size: 12px; font-weight: 750; }
    .chip { padding: 8px 11px; }
    .chip.active { background: var(--primary); color: var(--button-text); }
    .pill { padding: 6px 9px; }
    .primary-btn { height: 54px; border-radius: 22px; display: grid; place-items: center; background: var(--primary); color: var(--button-text); font-size: 15px; font-weight: 820; box-shadow: 0 16px 34px var(--shadow); }
    .bottom-action { position: absolute; left: 18px; right: 18px; bottom: 18px; }
    .nav { position: absolute; left: 18px; right: 18px; bottom: 14px; height: 58px; border-radius: 24px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); box-shadow: 0 16px 34px var(--shadow); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; justify-items: center; backdrop-filter: blur(16px); }
    .nav-item { display: grid; gap: 3px; justify-items: center; color: var(--muted); font-size: 10px; font-weight: 760; }
    .nav-item b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; }
    .nav-item.active { color: var(--text); }
    .nav-item.active b { background: var(--primary); color: var(--button-text); }
    .theme-note { position: fixed; left: 24px; bottom: 18px; color: var(--muted); font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <main class="page">
    <div class="status"><span>9:41</span><span>5G 100%</span></div>
    <section class="content">
      <div class="topbar">
        <div class="icon-btn">‹</div>
        <h1 style="font-size:23px;">新增穿搭</h1>
        <div class="icon-btn">⋯</div>
      </div>

      <div class="card" style="display:grid;grid-template-columns:1fr 92px;gap:14px;align-items:center;">
        <div><div class="muted" style="font-size:12px;font-weight:760;">今天的搭配</div><h1 style="font-size:25px;margin-top:8px;">先放照片，<br />再補一點感覺</h1></div>
        <div style="height:92px;border-radius:22px;background:linear-gradient(145deg,var(--accent),var(--primary));color:var(--button-text);display:grid;place-items:center;text-align:center;font-weight:850;">JUN<br><span style="font-size:34px;line-height:1;">02</span></div>
      </div>

      <div class="section">
        <h2>照片</h2>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
          <div style="height:104px;border-radius:20px;background:linear-gradient(145deg,var(--accent),var(--surface-alt));"></div>
          <div style="height:104px;border-radius:20px;background:linear-gradient(145deg,var(--accent-2),var(--surface-alt));"></div>
          <div style="height:104px;border-radius:20px;border:1px dashed var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);font-size:26px;">+</div><div style="height:104px;border-radius:20px;border:1px dashed var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);font-size:26px;">+</div><div style="height:104px;border-radius:20px;border:1px dashed var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);font-size:26px;">+</div><div style="height:104px;border-radius:20px;border:1px dashed var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted);font-size:26px;">+</div>
        </div>
      </div>

      <div class="section">
        <h2>標籤</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;"><span class="chip active">通勤</span><span class="chip">微正式</span><span class="chip">冷氣房</span><span class="chip">舒服</span><span class="chip">+ 新增</span></div>
      </div>

      <div class="section">
        <h2>備註</h2>
        <div class="card" style="min-height:112px;color:var(--muted);font-size:13px;line-height:1.55;">薄針織可以應付捷運冷氣，鞋子換成樂福會更俐落。下次可配銀色耳環。</div>
      </div>
    </section>
    <div class="bottom-action"><div class="primary-btn">保存今日穿搭</div></div>
  </main>
  <div class="theme-note">City Blue / add-light</div>
</body>
</html>

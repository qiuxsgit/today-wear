<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Night Gallery Statistics - light</title>
  <style>
    :root {
      --bg:#F8F4EC; --surface:#FFFDF8; --surface-alt:#EEE4D3; --primary:#2B2722;
      --accent:#C9A46A; --accent-2:#4F6477; --text:#2B2722; --muted:#786F64;
      --line:#E3D7C6; --tag:#EFE3D1; --shadow:rgba(54,43,32,.13); --button-text:#FFF8EC;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      letter-spacing: 0; display: grid; place-items: start center; padding: 28px;
    }
    .page {
      width: 390px; min-height: 844px; overflow: hidden; background: var(--bg);
      border: 1px solid var(--line); border-radius: 28px; box-shadow: 0 24px 60px var(--shadow);
      position: relative;
    }
    .status { height: 42px; padding: 14px 22px 0; display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; }
    .content { padding: 12px 18px 92px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .title-block small { color: var(--muted); font-size: 12px; font-weight: 700; }
    h1 { margin: 4px 0 0; font-size: 28px; line-height: 1.08; font-weight: 850; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 17px; font-weight: 820; letter-spacing: 0; }
    .icon-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--text); border: 1px solid var(--line); box-shadow: 0 8px 18px var(--shadow); font-size: 18px; font-weight: 800; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 16px; box-shadow: 0 12px 28px var(--shadow); }
    .soft-card { background: var(--surface-alt); border-radius: 20px; padding: 14px; }
    .section { margin-top: 18px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .muted { color: var(--muted); }
    .chip, .pill { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--tag); color: var(--muted); font-size: 12px; font-weight: 750; }
    .chip { padding: 8px 11px; }
    .chip.active { background: var(--primary); color: var(--button-text); }
    .pill { padding: 6px 9px; }
    .primary-btn { height: 54px; border-radius: 22px; display: grid; place-items: center; background: var(--primary); color: var(--button-text); font-size: 15px; font-weight: 820; box-shadow: 0 16px 34px var(--shadow); }
    .bottom-action { position: absolute; left: 18px; right: 18px; bottom: 18px; }
    .nav { position: absolute; left: 18px; right: 18px; bottom: 14px; height: 58px; border-radius: 24px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); box-shadow: 0 16px 34px var(--shadow); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; justify-items: center; backdrop-filter: blur(16px); }
    .nav-item { display: grid; gap: 3px; justify-items: center; color: var(--muted); font-size: 10px; font-weight: 760; }
    .nav-item b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; }
    .nav-item.active { color: var(--text); }
    .nav-item.active b { background: var(--primary); color: var(--button-text); }
    .theme-note { position: fixed; left: 24px; bottom: 18px; color: var(--muted); font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <main class="page">
    <div class="status"><span>9:41</span><span>5G 100%</span></div>
    <section class="content">
      <div class="topbar">
        <div class="title-block"><small>Night Gallery · light</small><h1>穿搭統計</h1></div>
        <div class="icon-btn">↻</div>
      </div>

      <div class="card" style="background:linear-gradient(145deg,var(--primary),var(--accent));color:var(--button-text);">
        <div class="row"><span style="font-size:13px;font-weight:750;opacity:.82;">June 2026</span><span class="pill" style="background:rgba(255,255,255,.18);color:var(--button-text);">本月</span></div>
        <div style="display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin-top:18px;">
          <div><div style="font-size:46px;font-weight:860;line-height:1;">12</div><div style="font-size:13px;font-weight:760;opacity:.86;">已記錄穿搭天數</div></div>
          <div style="width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--button-text) 0 68%,rgba(255,255,255,.22) 68%);display:grid;place-items:center;"><div style="width:58px;height:58px;border-radius:50%;background:var(--primary);display:grid;place-items:center;font-weight:850;">68%</div></div>
        </div>
      </div>

      <div class="section" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="card"><div class="muted" style="font-size:12px;font-weight:760;">最近 7 天</div><div style="font-size:30px;font-weight:850;margin-top:6px;">5</div></div>
        <div class="card"><div class="muted" style="font-size:12px;font-weight:760;">總穿搭</div><div style="font-size:30px;font-weight:850;margin-top:6px;">86</div></div>
      </div>

      <div class="section card">
        <h2>標籤使用頻率</h2>
        
          <div style="margin:13px 0;">
            <div class="row" style="font-size:13px;font-weight:760;"><span>通勤</span><span class="muted">92%</span></div>
            <div style="height:10px;border-radius:999px;background:var(--surface-alt);margin-top:8px;overflow:hidden;"><div style="width:92%;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--accent));"></div></div>
          </div>
          <div style="margin:13px 0;">
            <div class="row" style="font-size:13px;font-weight:760;"><span>舒服</span><span class="muted">76%</span></div>
            <div style="height:10px;border-radius:999px;background:var(--surface-alt);margin-top:8px;overflow:hidden;"><div style="width:76%;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--accent));"></div></div>
          </div>
          <div style="margin:13px 0;">
            <div class="row" style="font-size:13px;font-weight:760;"><span>晴天</span><span class="muted">64%</span></div>
            <div style="height:10px;border-radius:999px;background:var(--surface-alt);margin-top:8px;overflow:hidden;"><div style="width:64%;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--accent));"></div></div>
          </div>
          <div style="margin:13px 0;">
            <div class="row" style="font-size:13px;font-weight:760;"><span>約會</span><span class="muted">42%</span></div>
            <div style="height:10px;border-radius:999px;background:var(--surface-alt);margin-top:8px;overflow:hidden;"><div style="width:42%;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--accent));"></div></div>
          </div>
      </div>

      <div class="section card">
        <h2>本月穿搭靈感</h2>
        <div class="row"><span class="chip active">奶油針織</span><span class="chip">直筒牛仔</span><span class="chip">樂福鞋</span></div>
      </div>
    </section>
    <div class="nav">
  <div class="nav-item "><b>⌂</b><span>首頁</span></div><div class="nav-item "><b>□</b><span>日曆</span></div><div class="nav-item "><b>+</b><span>新增</span></div><div class="nav-item active"><b>▥</b><span>統計</span></div><div class="nav-item "><b>○</b><span>我的</span></div>
</div>
  </main>
  <div class="theme-note">Night Gallery / statistics-light</div>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Night Gallery Profile - dark</title>
  <style>
    :root {
      --bg:#10100F; --surface:#1C1B19; --surface-alt:#292724; --primary:#F3E9DA;
      --accent:#C9A46A; --accent-2:#8FA9BF; --text:#F3E9DA; --muted:#A9A097;
      --line:#393530; --tag:#34312D; --shadow:rgba(0,0,0,.38); --button-text:#10100F;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      letter-spacing: 0; display: grid; place-items: start center; padding: 28px;
    }
    .page {
      width: 390px; min-height: 844px; overflow: hidden; background: var(--bg);
      border: 1px solid var(--line); border-radius: 28px; box-shadow: 0 24px 60px var(--shadow);
      position: relative;
    }
    .status { height: 42px; padding: 14px 22px 0; display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; }
    .content { padding: 12px 18px 92px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .title-block small { color: var(--muted); font-size: 12px; font-weight: 700; }
    h1 { margin: 4px 0 0; font-size: 28px; line-height: 1.08; font-weight: 850; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 17px; font-weight: 820; letter-spacing: 0; }
    .icon-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--text); border: 1px solid var(--line); box-shadow: 0 8px 18px var(--shadow); font-size: 18px; font-weight: 800; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 16px; box-shadow: 0 12px 28px var(--shadow); }
    .soft-card { background: var(--surface-alt); border-radius: 20px; padding: 14px; }
    .section { margin-top: 18px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .muted { color: var(--muted); }
    .chip, .pill { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--tag); color: var(--muted); font-size: 12px; font-weight: 750; }
    .chip { padding: 8px 11px; }
    .chip.active { background: var(--primary); color: var(--button-text); }
    .pill { padding: 6px 9px; }
    .primary-btn { height: 54px; border-radius: 22px; display: grid; place-items: center; background: var(--primary); color: var(--button-text); font-size: 15px; font-weight: 820; box-shadow: 0 16px 34px var(--shadow); }
    .bottom-action { position: absolute; left: 18px; right: 18px; bottom: 18px; }
    .nav { position: absolute; left: 18px; right: 18px; bottom: 14px; height: 58px; border-radius: 24px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); box-shadow: 0 16px 34px var(--shadow); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; justify-items: center; backdrop-filter: blur(16px); }
    .nav-item { display: grid; gap: 3px; justify-items: center; color: var(--muted); font-size: 10px; font-weight: 760; }
    .nav-item b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; }
    .nav-item.active { color: var(--text); }
    .nav-item.active b { background: var(--primary); color: var(--button-text); }
    .theme-note { position: fixed; left: 24px; bottom: 18px; color: var(--muted); font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <main class="page">
    <div class="status"><span>9:41</span><span>5G 100%</span></div>
    <section class="content">
      <div class="topbar">
        <div class="title-block"><small>Night Gallery · dark</small><h1>我的</h1></div>
        <div class="icon-btn">⚙</div>
      </div>

      <div class="card" style="text-align:center;">
        <div style="width:78px;height:78px;border-radius:50%;margin:0 auto 14px;background:linear-gradient(145deg,var(--accent),var(--primary));display:grid;place-items:center;color:var(--button-text);font-size:30px;font-weight:850;">穿</div>
        <div style="font-size:20px;font-weight:850;">Qiuxs</div>
        <div class="muted" style="font-size:13px;margin-top:6px;">喜歡把每天穿什麼記下來</div>
      </div>

      <div class="section card">
        <h2>外觀與偏好</h2>
        <div class="row" style="height:48px;border-bottom:1px solid var(--line);"><span style="font-weight:760;">外觀主題</span><span class="muted" style="font-size:13px;">Night Gallery ›</span></div><div class="row" style="height:48px;border-bottom:1px solid var(--line);"><span style="font-weight:760;">顯示模式</span><span class="muted" style="font-size:13px;">深色模式 ›</span></div><div class="row" style="height:48px;border-bottom:1px solid var(--line);"><span style="font-weight:760;">標籤管理</span><span class="muted" style="font-size:13px;">12 個標籤 ›</span></div><div class="row" style="height:48px;border-bottom:1px solid var(--line);"><span style="font-weight:760;">語言</span><span class="muted" style="font-size:13px;">繁體中文 ›</span></div>
      </div>

      <div class="section card">
        <h2>關於應用</h2>
        <div class="row" style="height:46px;border-bottom:1px solid var(--line);"><span style="font-weight:720;">隱私政策</span><span class="muted" style="font-size:13px;">›</span></div><div class="row" style="height:46px;border-bottom:1px solid var(--line);"><span style="font-weight:720;">使用條款</span><span class="muted" style="font-size:13px;">›</span></div><div class="row" style="height:46px;border-bottom:1px solid var(--line);"><span style="font-weight:720;">聯絡我們</span><span class="muted" style="font-size:13px;">›</span></div><div class="row" style="height:46px;border-bottom:1px solid var(--line);"><span style="font-weight:720;">版本</span><span class="muted" style="font-size:13px;">1.0.0</span></div>
      </div>
    </section>
    <div class="nav">
  <div class="nav-item "><b>⌂</b><span>首頁</span></div><div class="nav-item "><b>□</b><span>日曆</span></div><div class="nav-item "><b>+</b><span>新增</span></div><div class="nav-item "><b>▥</b><span>統計</span></div><div class="nav-item active"><b>○</b><span>我的</span></div>
</div>
  </main>
  <div class="theme-note">Night Gallery / profile-dark</div>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Default / Soft Wardrobe Appearance - light</title>
  <style>
    :root {
      --bg:#FBF8F3; --surface:#FFFDF9; --surface-alt:#F4EFE7; --primary:#25221F;
      --accent:#C78363; --accent-2:#7D9A88; --text:#25221F; --muted:#7C746D;
      --line:#E8DDD0; --tag:#EFE7DC; --shadow:rgba(85,66,48,.12); --button-text:#FFFAF4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      letter-spacing: 0; display: grid; place-items: start center; padding: 28px;
    }
    .page {
      width: 390px; min-height: 844px; overflow: hidden; background: var(--bg);
      border: 1px solid var(--line); border-radius: 28px; box-shadow: 0 24px 60px var(--shadow);
      position: relative;
    }
    .status { height: 42px; padding: 14px 22px 0; display: flex; justify-content: space-between; font-size: 11px; font-weight: 800; }
    .content { padding: 12px 18px 92px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .title-block small { color: var(--muted); font-size: 12px; font-weight: 720; }
    h1 { margin: 4px 0 0; font-size: 28px; line-height: 1.08; font-weight: 850; letter-spacing: 0; }
    h2 { margin: 0 0 12px; font-size: 17px; font-weight: 820; letter-spacing: 0; }
    .icon-btn { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--text); border: 1px solid var(--line); box-shadow: 0 8px 18px var(--shadow); font-size: 18px; font-weight: 800; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 16px; box-shadow: 0 12px 28px var(--shadow); }
    .section { margin-top: 18px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .muted { color: var(--muted); }
    .chip, .pill { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--tag); color: var(--muted); font-size: 12px; font-weight: 750; }
    .chip { padding: 8px 11px; }
    .chip.active { background: var(--primary); color: var(--button-text); }
    .pill { padding: 6px 9px; }
    .nav { position: absolute; left: 18px; right: 18px; bottom: 14px; height: 58px; border-radius: 24px; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); box-shadow: 0 16px 34px var(--shadow); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; justify-items: center; backdrop-filter: blur(16px); }
    .nav-item { display: grid; gap: 3px; justify-items: center; color: var(--muted); font-size: 10px; font-weight: 760; }
    .nav-item b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; }
    .nav-item.active { color: var(--text); }
    .nav-item.active b { background: var(--primary); color: var(--button-text); }
    .theme-note { position: fixed; left: 24px; bottom: 18px; color: var(--muted); font-size: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <main class="page">
    <div class="status"><span>9:41</span><span>5G 100%</span></div>
    <section class="content" style="padding-bottom:22px;">
      <div class="topbar">
        <div class="icon-btn">‹</div>
        <h1 style="font-size:24px;">外觀主題</h1>
        <div class="icon-btn">✓</div>
      </div>
      <h2>顯示模式</h2>
      <div class="card" style="padding:6px;">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-alt);border-radius:18px;padding:5px;">
          <div class="chip active" style="height:36px;">淺色</div>
          <div class="chip" style="height:36px;">跟隨</div>
          <div class="chip " style="height:36px;">深色</div>
        </div>
      </div>
      <div class="section"><h2>主題色盤</h2><div style="display:grid;gap:10px;"><div class="row" style="min-height:72px;padding:10px 12px;border-radius:22px;background:var(--surface);border:1px solid var(--primary);">
      <div class="row" style="justify-content:start;">
        <div style="width:52px;height:52px;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);">
          <span style="background:#25221F;"></span><span style="background:#FBF8F3;"></span><span style="background:#C78363;"></span><span style="background:#EFE7DC;"></span>
        </div>
        <div><div style="font-size:14px;font-weight:850;">Soft Wardrobe</div><div class="muted" style="font-size:11px;margin-top:4px;">柔和衣櫥 · 預設</div></div>
      </div>
      <span class="pill" style="background:var(--primary);color:var(--button-text);">✓</span>
    </div><div class="row" style="min-height:72px;padding:10px 12px;border-radius:22px;background:var(--surface);border:1px solid var(--line);">
      <div class="row" style="justify-content:start;">
        <div style="width:52px;height:52px;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);">
          <span style="background:#486554;"></span><span style="background:#F7F8F2;"></span><span style="background:#8AA07B;"></span><span style="background:#E4EADB;"></span>
        </div>
        <div><div style="font-size:14px;font-weight:850;">Matcha Minimal</div><div class="muted" style="font-size:11px;margin-top:4px;">擴展主題</div></div>
      </div>
      
    </div><div class="row" style="min-height:72px;padding:10px 12px;border-radius:22px;background:var(--surface);border:1px solid var(--line);">
      <div class="row" style="justify-content:start;">
        <div style="width:52px;height:52px;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);">
          <span style="background:#3F68A8;"></span><span style="background:#F6F8FB;"></span><span style="background:#7396BF;"></span><span style="background:#E6EDF7;"></span>
        </div>
        <div><div style="font-size:14px;font-weight:850;">City Blue</div><div class="muted" style="font-size:11px;margin-top:4px;">擴展主題</div></div>
      </div>
      
    </div><div class="row" style="min-height:72px;padding:10px 12px;border-radius:22px;background:var(--surface);border:1px solid var(--line);">
      <div class="row" style="justify-content:start;">
        <div style="width:52px;height:52px;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);">
          <span style="background:#7B4B54;"></span><span style="background:#FCF6F6;"></span><span style="background:#D79AA5;"></span><span style="background:#F0DDE1;"></span>
        </div>
        <div><div style="font-size:14px;font-weight:850;">Rose Editorial</div><div class="muted" style="font-size:11px;margin-top:4px;">擴展主題</div></div>
      </div>
      
    </div><div class="row" style="min-height:72px;padding:10px 12px;border-radius:22px;background:var(--surface);border:1px solid var(--line);">
      <div class="row" style="justify-content:start;">
        <div style="width:52px;height:52px;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);">
          <span style="background:#2B2722;"></span><span style="background:#F8F4EC;"></span><span style="background:#C9A46A;"></span><span style="background:#EFE3D1;"></span>
        </div>
        <div><div style="font-size:14px;font-weight:850;">Night Gallery</div><div class="muted" style="font-size:11px;margin-top:4px;">擴展主題</div></div>
      </div>
      
    </div></div></div>
    </section>
  </main>
  <div class="theme-note">Default / Soft Wardrobe / appearance-light</div>
</body>
</html>
